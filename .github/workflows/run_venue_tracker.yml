name: Run Venue Tracker Agents

on:
  schedule:
    # Monday, Wednesday, Saturday at 04:00 UTC
    - cron: '0 4 * * 1,3,6'
  workflow_dispatch: 

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    
    # Grant permissions explicitly at the job level
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Workflow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main_workflow.py

      # --- NEW ARTIFACT STEP ---
      - name: Save Raw Gigs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-gigs-data
          path: data/gigs_raw.json
          retention-days: 7 
      # -------------------------
      
      - name: Commit and Push Updated Gigs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/venue_gigs.json
          git diff --staged --quiet || git commit -m "chore: automated venue tracker update [skip ci]"
          git push

      # Rebuild the website on Netlify after the new gigs are saved
      - name: Trigger Netlify Build
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
